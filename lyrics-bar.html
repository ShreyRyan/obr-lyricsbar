<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/lyrics-bar.css" />
    <title>歌词</title>
  </head>
  <body>
    <div id="lyrics-bar">
      <div id="lyrics-bar-handle" class="lyrics-bar-handle" title="拖拽移动歌词">⋮⋮</div>
      <div class="lyrics-content">
        <div class="lyrics-row">
          <span class="lyrics-prev"></span>
          <span class="lyrics-current">等待 DM 开启歌词</span>
          <span class="lyrics-next"></span>
        </div>
        <div class="progress-row">
          <div class="progress-bar"><div class="progress-fill"></div></div>
          <span class="progress-time">00:00 / 00:00</span>
        </div>
        <div class="controls-row" id="controls-row">
          <button id="btn-play" class="lyrics-btn primary">▶</button>
          <button id="btn-pause" class="lyrics-btn">⏸</button>
          <button id="btn-stop" class="lyrics-btn danger">⏹</button>
          <button id="btn-toggle-viz" class="lyrics-btn">👁 隐藏</button>
          <button id="btn-offset-minus" class="lyrics-btn">-0.1s</button>
          <button id="btn-offset-plus" class="lyrics-btn">+0.1s</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/lyrics-bar.js"></script>
  </body>
</html>
